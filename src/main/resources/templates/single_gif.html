<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Single Article</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container-fluid">
    <h2 class="navbar-brand">Teamwork</h2>
    <a th:href="@{/feeds}" class="text-decoration-none">
      Go to feeds
    </a>
    <ul class="d-flex list-unstyled" role="search">
      <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/api/v1/articles}">Post Article</a></li>
      <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/api/v1/gifs}">Post Gif</a></li>
      <li class=""><a class="text-white text-decoration-none" th:href="@{/logout}">Logout</a></li>
    </ul>
  </div>
</nav>
<br>
<br>
<h1 th:text="${gif.title}"></h1>
<img th:src="${gif.imageUrl}" th:alt="${gif.title}">
<hr/>
<h3>Comments:</h3>
<ul>
  <li th:each="gifComment : ${gifComments}">
    <span th:text="${gifComment.comment}"></span>
  </li>
</ul>
</body>
</html>
