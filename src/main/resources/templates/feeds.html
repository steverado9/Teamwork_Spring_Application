<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Feeds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
    <div class="container-fluid">
        <h2 class="navbar-brand">Teamwork</h2>
        <a class="navbar-brand">Feeds</a>
        <ul class="d-flex list-unstyled" role="search">
            <li th:if="${admin}" class="me-4"><a class="text-white text-decoration-none"
                                                 th:href="@{/api/v1/auth/create_user}">Create employee</a></li>
            <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/api/v1/articles}">Post Article</a></li>
            <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/api/v1/gifs}">Post Gif</a></li>
            <li class=""><a class="text-white text-decoration-none" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>
<br>
<br>
<div class="container mt-4">
    <div class="row g-4">

        <!-- Articles -->
        <div class="col-md-4" th:each="article : ${articles}">
            <div class="card h-100 shadow-sm">
                <div class="card-body text-center">

                    <h5 class="card-title">
                        <a th:text="${article.title}"
                           th:href="@{/api/v1/articles/{id}(id=${article.id})}"
                           class="text-decoration-none"></a>
                    </h5>

                    <p class="card-text" th:text="${article.content}"></p>

                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a th:href="@{/api/v1/articles/{id}/comment(id=${article.id})}"
                           class="btn btn-success btn-sm">Comment</a>

                        <a th:href="@{/api/v1/articles/edit/{id}(id=${article.id})}"
                           class="btn btn-primary btn-sm">Edit</a>
                    </div>

                    <form th:action="@{/api/v1/articles/delete/{id}(id=${article.id})}"
                          method="POST" class="mt-2">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger btn-sm w-100">
                            Delete
                        </button>
                    </form>

                </div>
            </div>
        </div>


        <!-- GIFS -->
        <div class="col-md-4" th:each="gif : ${gifs}">
            <div class="card h-100 shadow-sm">

                <img th:src="${gif.imageUrl}" class="card-img-top" th:alt="${gif.title}">

                <div class="card-body text-center">

                    <h6>
                        <a th:href="@{/api/v1/gifs/{id}(id=${gif.id})}"
                           th:text="${gif.title}"
                           class="text-decoration-none"></a>
                    </h6>

                    <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">

                        <a th:href="@{/api/v1/gifs/{id}/comment(id=${gif.id})}"
                           class="btn btn-success btn-sm">
                            Comment
                        </a>

                        <form th:action="@{/api/v1/gifs/delete/{id}(id=${gif.id})}"
                              method="POST" class="delete-form">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </form>

                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.querySelectorAll(".delete-form").forEach(form => {
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            Swal.fire({
                title: "Are you sure?",
                text: "This action cannot be undone!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                cancelButtonColor: "#3085d6",
                confirmButtonText: "Yes, delete it!"
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });
</script>
</body>
</html>
