<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Comment Article</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container-fluid">
    <h2 class="navbar-brand">Teamwork</h2>
    <h1 class="navbar-brand">
      Add a comment
    </h1>
    <ul class="d-flex list-unstyled" role="search">
      <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/feeds}">Feeds</a></li>
      <li class="me-4"><a class="text-white text-decoration-none" th:href="@{/api/v1/articles}">Post Article</a></li>
      <li class=""><a class="text-white text-decoration-none" th:href="@{/logout}">Logout</a></li>
    </ul>
  </div>
</nav>
<br>
<br>
<div class="container">
  <div class="row">
    <form th:action="@{/api/v1/gifs/{id}/comment(id=${gifId})}" th:object="${gifComment}" method="POST">
      <div class="mb-3">
        <textarea class="form-control" th:field="*{comment}" id="exampleFormControlTextarea1" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
</body>
</html>
